name: Node CI

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: install
        run: yarn install --frozen-lockfile

      - name: lint
        run: yarn lint

      - name: test
        run: yarn test:consumer
